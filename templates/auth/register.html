{% extends 'base.html' %}

{% block title %}Register Account — ResumeAI Pro{% endblock %}

{% block content %}
<div style="min-height: calc(100vh - 120px); display: flex; align-items: center; justify-content: center; padding: 40px 20px;">
    <div class="glass-card glass-card-3d" style="width: 100%; max-width: 480px; padding: 40px; border-color: var(--border-glass-glow);">
        <div style="text-align: center; margin-bottom: 30px;">
            <i class="fas fa-user-plus text-gradient" style="font-size: 2.5rem; margin-bottom: 12px;"></i>
            <h2 style="font-size: 1.8rem;" class="font-heading">Create Account</h2>
            <p style="color: #94A3B8; font-size: 0.9rem;">Join ResumeAI Pro & generate intelligent ATS resumes.</p>
        </div>

        <form method="POST" action="{{ url_for('register') }}">
            <div class="form-group">
                <label class="form-label"><i class="fas fa-user" style="margin-right:6px; color:var(--neon-cyan);"></i> Username</label>
                <input type="text" name="username" class="form-control" placeholder="johndoe" required>
            </div>

            <div class="form-group">
                <label class="form-label"><i class="fas fa-envelope" style="margin-right:6px; color:var(--neon-cyan);"></i> Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="john@example.com" required>
            </div>

            <div class="form-group">
                <label class="form-label"><i class="fas fa-lock" style="margin-right:6px; color:var(--neon-purple);"></i> Password</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <div class="form-group">
                <label class="form-label"><i class="fas fa-shield-alt" style="margin-right:6px; color:var(--neon-purple);"></i> Confirm Password</label>
                <input type="password" name="confirm_password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; padding: 14px; margin-top: 10px;">
                <i class="fas fa-rocket"></i> Create Account Free
            </button>
        </form>

        <div style="text-align: center; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border-glass); font-size: 0.9rem; color: #94A3B8;">
            Already have an account? <a href="{{ url_for('login') }}" style="color: var(--neon-cyan); font-weight: 600; text-decoration: none;">Log In</a>
        </div>
    </div>
</div>
{% endblock %}
