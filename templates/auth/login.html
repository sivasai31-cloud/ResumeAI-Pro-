{% extends 'base.html' %}

{% block title %}Log In — ResumeAI Pro{% endblock %}

{% block content %}
<div style="min-height: calc(100vh - 120px); display: flex; align-items: center; justify-content: center; padding: 40px 20px;">
    <div class="glass-card glass-card-3d" style="width: 100%; max-width: 440px; padding: 40px; border-color: var(--border-glass-glow);">
        <div style="text-align: center; margin-bottom: 30px;">
            <i class="fas fa-brain text-gradient" style="font-size: 2.5rem; margin-bottom: 12px;"></i>
            <h2 style="font-size: 1.8rem;" class="font-heading">Welcome Back</h2>
            <p style="color: #94A3B8; font-size: 0.9rem;">Enter your credentials to access your futuristic dashboard.</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label class="form-label"><i class="fas fa-user" style="margin-right:6px; color:var(--neon-cyan);"></i> Username or Email</label>
                <input type="text" name="username" class="form-control" placeholder="demouser" required>
            </div>

            <div class="form-group">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <label class="form-label"><i class="fas fa-lock" style="margin-right:6px; color:var(--neon-purple);"></i> Password</label>
                    <a href="{{ url_for('forgot_password') }}" style="font-size:0.8rem; color:var(--neon-cyan); text-decoration:none;">Forgot?</a>
                </div>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; padding: 14px; margin-top: 10px;">
                <i class="fas fa-sign-in-alt"></i> Log In to Dashboard
            </button>
        </form>

        <div style="text-align: center; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border-glass); font-size: 0.9rem; color: #94A3B8;">
            Don't have an account? <a href="{{ url_for('register') }}" style="color: var(--neon-cyan); font-weight: 600; text-decoration: none;">Register Now</a>
        </div>
    </div>
</div>
{% endblock %}
